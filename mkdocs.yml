site_name: JN - Technical Writing Portfolio
site_url:  jn-atelier.github.io
repo_url: https://github.com/jn-atelier/ab-portfolio.git
repo_name: GitHub
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - About: about.md
  - Portfolio:
      - User Documentation: portfolio/user-documentation.md
      - API Documentation: portfolio/api-documentation.md
      - Video Tutorials: tutorials/docs-as-code-series.md
      - Curriculum Vitae: cv.md

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
